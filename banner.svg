<svg width="900" height="360" viewBox="0 0 900 360" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#0d1117"/>
      <stop offset="100%" stop-color="#000000"/>
    </linearGradient>
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="1.4" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <rect width="900" height="360" rx="14" fill="url(#bg)" stroke="#30363d" stroke-width="1.5"/>

  <!-- title bar -->
  <rect x="0" y="0" width="900" height="38" rx="14" fill="#161b22"/>
  <rect x="0" y="24" width="900" height="14" fill="#161b22"/>
  <circle cx="24" cy="19" r="6" fill="#ff5f56"/>
  <circle cx="46" cy="19" r="6" fill="#ffbd2e"/>
  <circle cx="68" cy="19" r="6" fill="#27c93f"/>
  <text x="450" y="24" font-family="SFMono-Regular, Consolas, 'Courier New', monospace" font-size="13" fill="#8b949e" text-anchor="middle">rohith@kernel-space: ~/systems</text>

  <!-- body -->
  <g font-family="SFMono-Regular, Consolas, 'Courier New', monospace" font-size="16">
    <text x="30" y="76" fill="#3fb950">$ ./boot rohith-chitturi.os --verbose</text>

    <text x="30" y="106" fill="#8b949e">[ 0.000001 ] kernel: engineering-core v3.2 initializing...</text>
    <text x="30" y="132" fill="#8b949e">[ 0.014021 ] mounting  /dev/backend  /dev/distributed-systems  /dev/ai-agents</text>
    <text x="30" y="158" fill="#3fb950">[  OK  ] modules loaded: java · python · typescript · kafka · redis · neo4j</text>
    <text x="30" y="184" fill="#3fb950">[  OK  ] scheduler: process queue online (5 active projects)</text>

    <text x="30" y="222" fill="#e6edf3" font-weight="bold">$ whoami</text>
    <text x="30" y="248" fill="#79c0ff" filter="url(#glow)" font-size="19" font-weight="bold">&gt; Chitturi Naga Raja Teja Rohith — AI &amp; Backend Systems Engineer</text>
    <text x="30" y="272" fill="#8b949e">&gt; CSE @ Chaitanya Bharathi Institute of Technology (CBIT)</text>

    <text x="30" y="308" fill="#e6edf3" font-weight="bold">$ cat mission.txt</text>
    <text x="30" y="334" fill="#ffa657">&gt; Transforming information into intelligence, intelligence into impact.</text>

    <rect x="612" y="322" width="10" height="16" fill="#3fb950">
      <animate attributeName="opacity" values="1;0;1" dur="1.1s" repeatCount="indefinite"/>
    </rect>
  </g>
</svg>
