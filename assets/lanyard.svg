<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 80" width="100%" height="100%">
  <defs>
    <style>
      @import url('https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;700&amp;display=swap');
      .tag { font-family: 'JetBrains Mono', monospace; font-size: 14px; fill: #A855F7; font-weight: 700; }
      .box { fill: #12072B; stroke: #6D28D9; stroke-width: 1; rx: 8; ry: 8; }
      
      @keyframes float {
        0%, 100% { transform: translateY(0); }
        50% { transform: translateY(-3px); }
      }
      .floating { animation: float 4s infinite ease-in-out; }
    </style>
  </defs>
  
  <g class="floating" style="animation-delay: 0s;">
    <rect x="50" y="20" width="220" height="40" class="box" />
    <text x="160" y="45" text-anchor="middle" class="tag">Problem Solver</text>
  </g>

  <g class="floating" style="animation-delay: 1s;">
    <rect x="320" y="20" width="220" height="40" class="box" />
    <text x="430" y="45" text-anchor="middle" class="tag">AI Enthusiast</text>
  </g>

  <g class="floating" style="animation-delay: 2s;">
    <rect x="590" y="20" width="220" height="40" class="box" />
    <text x="700" y="45" text-anchor="middle" class="tag">System Designer</text>
  </g>

  <g class="floating" style="animation-delay: 3s;">
    <rect x="860" y="20" width="220" height="40" class="box" />
    <text x="970" y="45" text-anchor="middle" class="tag">Full Stack Developer</text>
  </g>
</svg>
