<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 300" width="100%" height="100%">
  <defs>
    <style>
      @import url('https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;700&amp;family=Inter:wght@400;600;800&amp;display=swap');
      .bg { fill: #0B0618; }
      .text-name { font-family: 'Inter', sans-serif; font-weight: 800; font-size: 48px; fill: #ffffff; }
      .text-title { font-family: 'JetBrains Mono', monospace; font-size: 24px; fill: #A855F7; }
      .text-quote { font-family: 'Inter', sans-serif; font-style: italic; font-size: 20px; fill: #a78bfa; opacity: 0.8; }
      .circuit { stroke: #6D28D9; stroke-width: 1.5; fill: none; opacity: 0.3; }
      .glow { filter: url(#glowFilter); }
      
      @keyframes pulse {
        0%, 100% { opacity: 0.3; transform: scale(1); }
        50% { opacity: 1; transform: scale(1.1); }
      }
      .particle { animation: pulse 3s infinite ease-in-out; transform-origin: center; }
      
      @keyframes slideText {
        0% { transform: translateY(10px); opacity: 0; }
        100% { transform: translateY(0); opacity: 1; }
      }
      .anim-text { animation: slideText 1.5s ease-out forwards; }
    </style>
    
    <filter id="glowFilter" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
    
    <linearGradient id="purpleGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#6D28D9" />
      <stop offset="100%" stop-color="#A855F7" />
    </linearGradient>

    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0B0618" />
      <stop offset="100%" stop-color="#12072B" />
    </linearGradient>

    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#6D28D9" stroke-width="0.5" stroke-opacity="0.1" />
    </pattern>
  </defs>

  <!-- Background -->
  <rect width="1200" height="300" fill="url(#bgGrad)" rx="16" ry="16" />
  
  <!-- Animated Border -->
  <rect width="1196" height="296" x="2" y="2" fill="none" stroke="url(#purpleGrad)" stroke-width="2" rx="14" ry="14" opacity="0.6">
    <animate attributeName="stroke-opacity" values="0.2;0.8;0.2" dur="4s" repeatCount="indefinite" />
  </rect>

  <!-- Grid overlay -->
  <rect width="1200" height="300" fill="url(#grid)" rx="16" ry="16" />

  <!-- Circuitry / Graph Lines -->
  <g class="circuit">
    <path d="M 900 300 L 900 200 L 950 150 L 1050 150 L 1100 100 L 1200 100" />
    <path d="M 950 150 L 950 50 L 1000 0" />
    <path d="M 0 250 L 100 250 L 150 200 L 200 200" />
    <circle cx="950" cy="150" r="4" fill="#A855F7" class="glow particle" />
    <circle cx="1050" cy="150" r="3" fill="#A855F7" class="glow particle" style="animation-delay: 1s;" />
    <circle cx="1100" cy="100" r="5" fill="#A855F7" class="glow particle" style="animation-delay: 2s;" />
    <circle cx="150" cy="200" r="3" fill="#A855F7" class="glow particle" style="animation-delay: 0.5s;" />
  </g>

  <!-- Animated Floating Particles using SMIL -->
  <circle cx="200" cy="50" r="2" fill="#A855F7" opacity="0.6">
    <animate attributeName="cy" values="50;20;50" dur="5s" repeatCount="indefinite" />
  </circle>
  <circle cx="800" cy="250" r="1.5" fill="#A855F7" opacity="0.8">
    <animate attributeName="cx" values="800;830;800" dur="7s" repeatCount="indefinite" />
  </circle>
  <circle cx="600" cy="80" r="2.5" fill="#6D28D9" opacity="0.5">
    <animate attributeName="cy" values="80;110;80" dur="6s" repeatCount="indefinite" />
  </circle>
  
  <!-- Central Content -->
  <g transform="translate(60, 100)">
    <text x="0" y="0" class="text-name anim-text">CHITTURI NAGA RAJA TEJA ROHITH</text>
    <text x="0" y="45" class="text-title anim-text" style="animation-delay: 0.3s; opacity: 0;"><tspan fill="#6D28D9">&gt;</tspan> AI Systems Engineer &amp; Full Stack Developer<animate attributeName="opacity" from="0" to="1" begin="0.3s" dur="1s" fill="freeze"/></text>
    <text x="0" y="100" class="text-quote anim-text" style="animation-delay: 0.6s; opacity: 0;">Building intelligent systems that solve real-world problems.
      <animate attributeName="opacity" from="0" to="1" begin="0.6s" dur="1s" fill="freeze"/>
    </text>
  </g>

  <!-- Terminal cursor blink -->
  <rect x="730" y="20" width="12" height="25" fill="#A855F7">
    <animate attributeName="opacity" values="1;0;1" dur="1s" repeatCount="indefinite" />
  </rect>

</svg>
